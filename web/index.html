<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main>
        <h1>Pokédex</h1>

        <form id="search-form">
            <label for="pokemon-name">Pokémon name</label>
            <input id="pokemon-name" type="text" placeholder="Gengar" required>
            <button type="submit">Search</button>
        </form>

        <p id="status" role="status"></p>
        <section id="pokemon-card" hidden>
            <h2 id="card-name"></h2>
            <img id="card-sprite" width="96" height="96" alt="">
            <p id="card-types"></p>
            <ul id="card-stats"></ul>
            <button id="add-to-team" type="button">Add to team</button>
        </section>
        <section id="team-panel">
            <h2 id="team-heading">My team (0/6)</h2>
            <ol id="team-slots" aria-labelledby="team-heading"></ol>
        </section>
    </main>
</body>

</html>
